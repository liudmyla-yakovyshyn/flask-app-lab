{% extends 'base.html' %}

{% block title %}Видалення поста{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('posts.static', filename='css/posts.css') }}">
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="info-card p-4 text-center">
            <h2 class="h4 fw-bold text-danger mb-3">Підтвердження видалення</h2>
            <p class="text-light mb-4">
                Ви дійсно бажаєте видалити пост <strong>«{{ post.title }}»</strong>?
                <br>
                <small class="text-muted">Цю дію неможливо скасувати.</small>
            </p>
            <form method="POST" action="{{ url_for('posts.delete_post', id=post.id) }}" class="d-flex justify-content-center gap-3">
                <a href="{{ url_for('posts.detail_post', id=post.id) }}" class="btn btn-outline-secondary">Скасувати</a>
                <button type="submit" class="btn btn-danger">Так, видалити</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
