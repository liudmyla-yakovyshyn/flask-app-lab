{% extends 'base.html' %}

{% block title %}{{ product.name }} | Деталі{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="info-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h3 fw-bold text-light mb-0">{{ product.name }}</h2>
                <span class="tag fs-5">${{ product.price }}</span>
            </div>
            <p class="text-muted leading-relaxed mb-4">{{ product.content }}</p>
            <div class="d-flex gap-2">
                <a href="{{ url_for('products.list_products') }}" class="btn btn-outline-accent btn-sm">Назад до списку</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
